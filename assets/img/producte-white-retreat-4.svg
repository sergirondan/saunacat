<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>White Retreat 4, sauna blanca amb vidriera i porxo cobert</title>
  <defs>
    <linearGradient id="cel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDEEEA"/><stop offset="1" stop-color="#D3D8D6"/>
    </linearGradient>
    <linearGradient id="vidre" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A423A" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#7A6A5A" stop-opacity=".78"/>
      <stop offset="1" stop-color="#2E2822" stop-opacity=".94"/>
    </linearGradient>
    <radialGradient id="brasa" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFC07A" stop-opacity=".85"/>
      <stop offset="1" stop-color="#FFC07A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="taulons" width="26" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 0V12" stroke="#B3A796" stroke-width="1.4" opacity=".5"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#cel)"/>
  <circle cx="670" cy="120" r="60" fill="#fff" opacity=".35"/>
  <path d="M0 470h800v130H0z" fill="#BDC2BF" opacity=".55"/>
  <path d="M0 470h800" stroke="#B0B6B3" stroke-width="2"/>
  <ellipse cx="400" cy="480" rx="285" ry="18" fill="#000" opacity=".14"/>

  <!-- cos -->
  <rect x="150" y="170" width="500" height="300" fill="#E4DCD0"/>
  <rect x="150" y="170" width="500" height="300" fill="#F7F3EC" opacity=".55"/>
  <rect x="150" y="170" width="500" height="300" fill="url(#taulons)"/>
  <rect x="150" y="170" width="500" height="300" fill="none" stroke="#CBC0B0" stroke-width="2"/>

  <!-- sostre inclinat amb ràfec -->
  <path d="M126 178 L674 130 L674 108 L126 156 Z" fill="#4A443E"/>
  <path d="M126 156 L674 108" stroke="#2F2B27" stroke-width="4"/>

  <!-- vidriera frontal -->
  <rect x="292" y="206" width="216" height="264" fill="#CBC0B0"/>
  <rect x="300" y="214" width="200" height="256" rx="2" fill="url(#vidre)"/>
  <path d="M400 214V470" stroke="#EFE9E0" stroke-width="5" opacity=".7"/>
  <path d="M318 462 L470 224" stroke="#fff" stroke-width="22" opacity=".1" stroke-linecap="round"/>
  <path d="M362 462 L496 274" stroke="#fff" stroke-width="10" opacity=".08" stroke-linecap="round"/>
  <circle cx="386" cy="342" r="4" fill="#EFE9E0"/>
  <ellipse cx="400" cy="392" rx="96" ry="76" fill="url(#brasa)" opacity=".5"/>

  <!-- porxo -->
  <rect x="524" y="222" width="112" height="248" fill="#D8D0C4" opacity=".85"/>
  <rect x="524" y="222" width="112" height="248" fill="url(#taulons)"/>
  <rect x="556" y="330" width="52" height="16" rx="3" fill="#B3A796"/>
  <rect x="556" y="352" width="52" height="10" rx="3" fill="#C6BBAA"/>
  <path d="M524 222v248" stroke="#B3A796" stroke-width="3"/>

  <!-- graons -->
  <rect x="272" y="470" width="256" height="14" rx="3" fill="#CBC0B0"/>
  <rect x="292" y="484" width="216" height="12" rx="3" fill="#B3A796"/>
</svg>
