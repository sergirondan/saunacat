<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img">
  <title>Interior d'una sauna de fusta clara amb bancs a dos nivells i estufa amb pedres volcàniques</title>
  <defs>
    <linearGradient id="fusta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9BE96"/>
      <stop offset="1" stop-color="#A8875F"/>
    </linearGradient>
    <radialGradient id="escalfor" cx=".78" cy=".6" r=".62">
      <stop offset="0" stop-color="#F0C68C" stop-opacity=".35"/>
      <stop offset="1" stop-color="#F0C68C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="taulons" width="36" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 0V16" stroke="#8C6F4C" stroke-width="1.3" opacity=".38"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#fusta)"/>
  <rect width="1200" height="800" fill="url(#taulons)"/>

  <!-- bancs -->
  <rect x="0" y="470" width="900" height="42" fill="#E0C8A4"/>
  <rect x="0" y="512" width="900" height="118" fill="#B4936A"/>
  <rect x="0" y="636" width="1040" height="40" fill="#E0C8A4"/>
  <rect x="0" y="676" width="1040" height="124" fill="#AA8A61"/>

  <!-- estufa i pedres -->
  <rect x="960" y="430" width="180" height="250" fill="#3A3733"/>
  <g fill="#5A564F">
    <circle cx="1000" cy="460" r="22"/><circle cx="1046" cy="452" r="26"/>
    <circle cx="1094" cy="464" r="20"/><circle cx="1022" cy="492" r="24"/>
    <circle cx="1072" cy="490" r="22"/>
  </g>
  <ellipse cx="1050" cy="470" rx="170" ry="130" fill="url(#escalfor)"/>

  <!-- galleda i cullerot -->
  <path d="M700 700h110l-14 92h-82z" fill="#C6C2BA"/>
  <rect x="694" y="690" width="122" height="12" rx="6" fill="#DBD7CF"/>
  <path d="M840 792 L990 672" stroke="#C09A6C" stroke-width="9" stroke-linecap="round"/>

  <!-- llum indirecta -->
  <rect x="0" y="442" width="900" height="4" fill="#FBEFD9" opacity=".7"/>
  <rect width="1200" height="800" fill="#4A3C29" opacity=".08"/>
</svg>
